name: Build J4125 OpenWrt Minimal

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -a -f
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Update & Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e .config ] && cp .config openwrt/.config
        cd openwrt

        # 1. 默认管理 IP 设为 192.168.50.1
        sed -i 's/192.168.1.1/192.168.50.1/g' package/base-files/files/bin/config_generate

        # 2. 系统原生标准命令设置 root 密码为 winds522，固化纯 IPv4 单口网络
        mkdir -p files/etc/uci-defaults
        cat << 'EOF' > files/etc/uci-defaults/99-custom-settings
        #!/bin/sh
        # 原生 chpasswd 设置密码，杜绝哈希死锁
        echo "root:winds522" | chpasswd

        # 单物理口直连：LAN 绑定 eth0，WAN 绑定 eth1 (无网桥)
        uci -q batch << EOI
        set network.lan.device='eth0'
        set network.lan.proto='static'
        set network.lan.ipaddr='192.168.50.1'
        set network.lan.netmask='255.255.255.0'
        delete network.lan.ip6assign

        set network.wan.device='eth1'
        delete network.wan6

        # 彻底移除 IPv6 委托前缀，清除警告
        delete network.globals.ula_prefix

        # 彻底关闭 IPv6 通告与 DHCPv6 服务
        delete dhcp.lan.dhcpv6
        delete dhcp.lan.ra
        delete dhcp.lan.ra_slaac
        delete dhcp.lan.ra_flags
        set dhcp.odhcpd.maindhcp='0'

        commit network
        commit dhcp
        EOI
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-custom-settings

        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/x86/64
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: J4125-release
        name: OpenWrt J4125 (IPv4 Only + OpenClash + WireGuard + UPnP + WOL + TTYD)
        body: |
          ### J4125 专用固件 (纯 IPv4 + Intel + Realtek + 无网桥单口)
          - **网络模式**: 纯 IPv4 (无 wan6，无 IPv6 广播)
          - **单口网络**: LAN 绑定 eth0，WAN 绑定 eth1
          - **硬件驱动**: Intel i210(igb), e1000e, Realtek 全系列(r8125 2.5G/r8168/r8169/r8152), glk 核显固件
          - **集成插件**: OpenClash, 原生内核 WireGuard, UPnP, WOL, TTYD 网页终端, Argon 主题
          - **管理后台**: http://192.168.50.1
          - **登录密码**: winds522
        files: ${{ env.FIRMWARE }}/*combined-efi.img.gz
