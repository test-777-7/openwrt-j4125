name: Build J4125 OpenWrt Minimal

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-23.05
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune -a -f
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
          libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
          python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt

    - name: Update & Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        ./scripts/feeds install luci-compat luci-lua-runtime

    - name: Load custom configuration
      run: |
        [ -e .config ] && cp .config openwrt/.config
        cd openwrt

        # 1. 默认管理 IP 设为 192.168.50.1
        sed -i 's/192.168.1.1/192.168.50.1/g' package/base-files/files/bin/config_generate

        # 2. 彻底解决 OpenClash 找不到 luci.cbi.datatypes 报错 (直接内嵌标准的 datatypes.lua)
        mkdir -p files/usr/lib/lua/luci/cbi
        cat << 'EOF' > files/usr/lib/lua/luci/cbi/datatypes.lua
        local fs = require "nixio.fs"
        local ip = require "luci.ip"
        local math = require "math"
        local util = require "luci.util"
        local tonumber, tostring, type, unpack = tonumber, tostring, type, unpack
        module "luci.cbi.datatypes"

        function bool(val)
            if val == "1" or val == "yes" or val == "on" or val == "true" then return true end
            if val == "0" or val == "no" or val == "off" or val == "false" then return true end
            return false
        end

        function uinteger(val)
            local n = tonumber(val)
            if n and n >= 0 and math.floor(n) == n then return true end
            return false
        end

        function integer(val)
            local n = tonumber(val)
            if n and math.floor(n) == n then return true end
            return false
        end

        function port(val)
            local n = tonumber(val)
            return (n and n >= 0 and n <= 65535)
        end

        function ipaddr(val)
            return ip.checkipv4(val) or ip.checkipv6(val)
        end

        function ip4addr(val)
            return ip.checkipv4(val)
        end

        function ip6addr(val)
            return ip.checkipv6(val)
        end

        function host(val)
            return hostname(val) or ipaddr(val)
        end

        function hostname(val)
            if not val or #val > 253 then return false end
            for part in val:gmatch("[^%.]+") do
                if #part < 1 or #part > 63 or not part:match("^[a-zA-Z0-9][-a-zA-Z0-9]*[a-zA-Z0-9]$") and not part:match("^[a-zA-Z0-9]$") then
                    return false
                end
            end
            return true
        end

        function string(val)
            return true
        end
        EOF

        # 3. 设置默认密码与单口纯 IPv4 网络
        mkdir -p files/etc/uci-defaults
        cat << 'EOF' > files/etc/uci-defaults/99-custom-settings
        #!/bin/sh
        echo "root:winds522" | chpasswd

        uci -q batch << EOI
        set network.lan.device='eth0'
        set network.lan.proto='static'
        set network.lan.ipaddr='192.168.50.1'
        set network.lan.netmask='255.255.255.0'
        delete network.lan.ip6assign

        set network.wan.device='eth1'
        delete network.wan6

        delete network.globals.ula_prefix

        delete dhcp.lan.dhcpv6
        delete dhcp.lan.ra
        delete dhcp.lan.ra_slaac
        delete dhcp.lan.ra_flags
        set dhcp.odhcpd.maindhcp='0'

        commit network
        commit dhcp
        EOI
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-custom-settings

        make defconfig

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/x86/64
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: J4125-release
        name: OpenWrt J4125 (IPv4 Only + OpenClash + WireGuard + UPnP + WOL + TTYD)
        body: |
          ### J4125 专用固件 (包含 OpenClash CBI 兼容修复)
          - **核心修复**: 内嵌 `luci/cbi/datatypes.lua`，彻底消除 OpenClash 菜单崩溃报错
          - **网络模式**: 纯 IPv4 (无 wan6，关闭 DHCPv6 广播)
          - **单口直连**: LAN 绑定 eth0 (192.168.50.1)，WAN 绑定 eth1
          - **驱动支持**: Intel J4125 + i210(igb), Realtek 全系列(r8125 2.5G/r8168/r8169)
          - **内置密码**: winds522
        files: ${{ env.FIRMWARE }}/*combined-efi.img.gz
